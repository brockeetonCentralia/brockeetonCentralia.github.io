      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
      <script>
        const button = document.getElementById("movingBtn");
        const playArea = document.getElementById("playArea");

        // Start button in center
        button.style.left = (window.innerWidth / 2 - button.offsetWidth / 2) + "px";
        button.style.top = (window.innerHeight / 2 - button.offsetHeight / 2) + "px";

        document.addEventListener("mousemove", function (e) {

          const rect = button.getBoundingClientRect();

          const buttonX = rect.left + rect.width / 2;
          const buttonY = rect.top + rect.height / 2;

          const distanceX = buttonX - e.clientX;
          const distanceY = buttonY - e.clientY;

          const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

          // Only move if cursor is close
          if (distance < 150) {

            const moveX = distanceX * 0.5;
            const moveY = distanceY * 0.5;

            let newLeft = button.offsetLeft + moveX;
            let newTop = button.offsetTop + moveY;

            // Keep button inside screen
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;

            newLeft = Math.max(0, Math.min(maxX, newLeft));
            newTop = Math.max(0, Math.min(maxY, newTop));

            button.style.left = newLeft + "px";
            button.style.top = newTop + "px";
          }
        });
      </script>
